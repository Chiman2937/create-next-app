name: CI - Run tests and upload coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run:
          npm run test:coverage

          # 이 단계 추가
      - name: Debug coverage files
        run: |
          echo "=== codecov.yml content ==="
          cat .codecov.yml || cat codecov.yml || echo "No codecov config found"
          echo ""
          echo "=== Coverage files generated ==="
          ls -la coverage/
          echo ""
          echo "=== clover.xml content (first 100 lines) ==="
          head -100 coverage/clover.xml
          echo ""
          echo "=== lcov.info content (first 50 lines) ==="
          head -50 coverage/lcov.info

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # 자세한 로그
