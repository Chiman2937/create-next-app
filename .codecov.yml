codecov:
  branch: main

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0
    patch:
      default:
        target: auto
        threshold: 0
        informational: false

comment:
  layout: "diff, flags, files, reach, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
